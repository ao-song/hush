server {
    listen 8100 default_server;
    server_name _;

    # Disable optimizations that can interfere with cache-control
    sendfile off;
    etag off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;";

    # Disable browser caching for all responses
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Serve favicon at root exactly
    location = /favicon.ico {
        alias /app/frontend/favicon.ico;
        access_log off;
        log_not_found off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Also serve favicon for single-segment subpaths like /hush/favicon.ico
    location ~ ^/[^/]+/favicon\.ico$ {
        alias /app/frontend/favicon.ico;
        access_log off;
        log_not_found off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Proxy API requests to the backend (keep using placeholder for subpath handling)
    location ##APP_SUB_PATH_PREFIX##/api/ {
        rewrite ^##APP_SUB_PATH_PREFIX##/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    # Redirect subpath without trailing slash to one with a trailing slash
    rewrite ^##APP_SUB_PATH_PREFIX##$ ##APP_SUB_PATH_PREFIX##/ permanent;

    # Serve frontend static files
    location ##APP_SUB_PATH_PREFIX##/ {
        alias /app/frontend/;
        index index.html;
        try_files $uri $uri/ ##APP_SUB_PATH_PREFIX##/;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }
}
